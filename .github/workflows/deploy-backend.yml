name: Deploy backend (Cloud Run)

on:
  push:
    branches: [main, claude/project-thread-l9bwxb] # TEMP: rama de prueba, quitar antes del merge
    paths: ['backend/**', '.github/workflows/deploy-backend.yml']
  workflow_dispatch:

concurrency: deploy-backend

env:
  GCP_PROJECT: ${{ vars.GCP_PROJECT_ID || 'biblioteca-central-2026' }}
  REGION: us-central1

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm test # si fallan las pruebas, no se despliega
      - name: Aplicar esquema a Supabase
        # El esquema es idempotente (IF NOT EXISTS / ON CONFLICT DO NOTHING): se puede
        # aplicar en cada despliegue. Si falla, no se despliega el backend.
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then echo "::warning::Falta el secreto SUPABASE_DB_URL; el backend aplicará el esquema al arrancar."; exit 0; fi
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -q -f database/schema.postgres.sql
          echo "Esquema aplicado a Supabase" >> "$GITHUB_STEP_SUMMARY"
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: gcloud run deploy
        run: >
          gcloud run deploy biblioteca-backend
          --source .
          --region "$REGION"
          --project "$GCP_PROJECT"
          --allow-unauthenticated
          --set-secrets=DATABASE_URL=database-url:latest,AUTH_SECRET=auth-secret:latest
          --quiet
      - name: Prueba de humo
        run: |
          url=$(gcloud run services describe biblioteca-backend --region "$REGION" --project "$GCP_PROJECT" --format='value(status.url)')
          curl -fsS --retry 5 --retry-delay 5 -o /dev/null "$url/api/v1/books"
          echo "Backend: $url" >> "$GITHUB_STEP_SUMMARY"
