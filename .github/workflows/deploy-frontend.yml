name: Deploy frontend (Cloudflare Workers)

on:
  push:
    branches: [main, claude/project-thread-l9bwxb] # TEMP: rama de prueba, quitar antes del merge
    paths: ['frontend/**', '.github/workflows/deploy-frontend.yml']
  workflow_dispatch:

concurrency: deploy-frontend

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test # si fallan las pruebas, no se despliega
        working-directory: frontend
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: frontend
          command: deploy
